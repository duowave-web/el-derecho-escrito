  <!-- Tarjeta social 1200x630. Fuente de la identidad: css/styles.css.
         fondo   #fbfaf7  (marfil de marca)
         acento  #2f6e68  (verdigris)
         serif   Cormorant Garamond 600, versales, tracking 0.02em

       OJO AL EXPORTAR A PNG: Cormorant Garamond no viene con el sistema. El
       @import de abajo solo lo resuelve un navegador; Illustrator, Figma o
       rsvg-convert lo ignoran y caen a Georgia, que es otro serif. Para que
       salga fiel: instala la fuente antes de exportar, o exporta desde el
       navegador. El texto cabe en 1200 px con ambas, asi que no se desborda
       en ningun caso. -->

