<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Plantilla de campana de El Derecho Escrito.

  ⚠️ ESTO NO ES UN ARCHIVO QUE SE COPIE AL SERVIDOR: SE PEGA EN EL PANEL, en
  Campanas → Plantillas. Las plantillas de campana viven en la base de datos,
  no en disco, asi que no hay nada que montar ni que reiniciar.

  ⚠️ LLEVA LA ENVOLTURA, NO EL ARTICULO. Lo que cambia en cada envio —la foto,
  la categoria, el titular, la entradilla y los dos botones— lo escribe
  scripts/newsletter.mjs y entra por el marcador de contenido de Listmonk.

  OJO AL EDITAR: este comentario viaja dentro de cada correo. Va corto; el
  razonamiento entero esta en CLAUDE.md.
-->
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{ .Campaign.Subject }}</title>
</head>

<body style="margin:0; padding:0; width:100%; background-color:#f6f5f7;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f6f5f7; margin:0; padding:0;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:100%; max-width:600px; background-color:#ffffff; border:1px solid #e5e1da;">

        <!-- Mancheta -->
        <tr>
          <td align="center" style="padding:28px 30px 0 30px;">
            <a href="https://duowave-web.github.io/el-derecho-escrito/" style="text-decoration:none;">
              <img src="https://duowave-web.github.io/el-derecho-escrito/apple-touch-icon.png"
                   width="46" height="46" alt=""
                   style="display:block; border:0; border-radius:5px;">
            </a>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:14px 30px 0 30px;">
            <p style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:bold; letter-spacing:0.08em; text-transform:uppercase; color:#1e1e1e;">
              El Derecho Escrito
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 30px 0 30px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="border-top:1px solid #e5e1da; font-size:0; line-height:0;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>

        <!-- ⚠️ AQUI ENTRA EL ARTICULO. Listmonk exige este marcador en toda
             plantilla de campana: sin el, el panel rechaza la plantilla. -->
        <tr>
          <td style="padding:0 30px;">
            {{ template "content" . }}
          </td>
        </tr>

        <!-- Pie -->
        <tr>
          <td style="padding:10px 30px 28px 30px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="border-top:1px solid #e5e1da; font-size:0; line-height:0;">&nbsp;</td></tr>
            </table>

            <p style="margin:20px 0 0; font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:1.7; color:#66615b; text-align:center;">
              Recibes este correo porque te suscribiste a
              <a href="https://duowave-web.github.io/el-derecho-escrito/" style="color:#66615b; text-decoration:underline;">El Derecho Escrito</a>,
              el blog de Juan Contera Miranda sobre Derecho administrativo y urbanismo.
            </p>

            <p style="margin:12px 0 0; font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:1.7; color:#66615b; text-align:center;">
              <a href="{{ UnsubscribeURL }}" style="color:#2f6e68; text-decoration:underline;">Darse de baja</a>
              &nbsp;&middot;&nbsp;
              <a href="{{ MessageURL }}" style="color:#66615b; text-decoration:underline;">Ver en el navegador</a>
            </p>

            <!-- ⚠️ AQUI NO VA el marcador TrackView, Y ES DELIBERADO. Ese marcador es
                 el pixel de seguimiento de aperturas, y el seguimiento esta
                 DESACTIVADO en los ajustes por decision de privacidad. Ponerlo
                 contradiria ese ajuste en el unico sitio donde no se ve. -->
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
