# ==========================================================================
# Se dispara cuando n8n abre un PR que toca contenido/.
#
# Qué hace: genera el HTML, las imágenes y los PDF, los añade AL MISMO PR, y
# deja un comentario con los avisos del build y capturas de cómo ha quedado.
#
# ⚠️ EL PR LO ABRE n8n EN ESTE MISMO REPOSITORIO, NO DESDE UN FORK. Es lo que
# permite usar `pull_request` a secas: en un PR desde un fork el GITHUB_TOKEN
# es de solo lectura y el `git push` de abajo fallaría. Si algún día el flujo
# cambia a forks, hay que pasar a `pull_request_target` y leer antes sus
# implicaciones de seguridad, porque ese evento ejecuta el workflow de la rama
# BASE con permisos de escritura sobre código que viene de fuera.
# ==========================================================================

name: Contenido

# ⚠️ SIN `paths:`, Y ES DELIBERADO AUNQUE PAREZCA UN DESPERDICIO DE RUNNER.
#
# Estuvo filtrado a `contenido/**`, `scripts/**` y `css/**`, que son las rutas
# que de verdad cambian lo generado. El problema no es lo que el filtro deja
# pasar: es lo que NO dispara. En un PR que no toca ninguna de las tres, este
# workflow no corre y el check `generar` **no se reporta nunca**.
#
# Sin ruleset eso solo es ruido. Con `generar` puesto como check OBLIGATORIO, un
# check que no se reporta no cuenta como ausente: cuenta como PENDIENTE PARA
# SIEMPRE, y **bloquea el merge sin que nada explique por qué**. Un PR que solo
# toque HTML, CLAUDE.md o este mismo archivo se quedaría muerto en el agua.
#
# Es el mismo modo de fallo que razona el bloque del PAT de más abajo —un check
# obligatorio que no llega a la cabeza del PR— pero entrando por la otra puerta:
# allí era el commit del bot el que se quedaba sin check, y aquí el PR entero.
#
# El precio es correr el job en PR que no cambian el sitio. Es tiempo de runner
# y nada más: el generador es idempotente, así que ahí no encuentra nada que
# empujar y termina en verde sin tocar el repositorio.
on:
  pull_request:

# Lo mínimo para hacer el trabajo: escribir en la rama del PR, comentar y
# registrar el Deployment que pinta el botón «View deployment».
permissions:
  contents: write
  pull-requests: write
  deployments: write

# ⚠️ `cancel-in-progress: false`, Y ESTUVO EN `true` HACIENDO QUE EL WORKFLOW SE
# MATARA A SÍ MISMO. El comentario que había aquí decía «si n8n empuja dos veces
# seguidas al mismo PR, la primera ejecución se cancela en vez de competir por el
# push». Previó que empujara n8n. No previó que **empuja este mismo workflow**.
#
# Lo que pasaba, y se ve entero en el PR #6:
#
#   Ejecución A, sobre el commit del autor
#     … genera, encuentra cambios, hace commit y PUSH a la rama del PR
#                                                     │
#          ese push es un evento `synchronize` ───────┘
#                                                     ↓
#     Ejecución B entra en el mismo grupo  →  cancel-in-progress  →  MATA a A
#
# A moría con seis pasos por delante y el PR se quedaba con una X roja sobre el
# commit del autor y un check verde sobre el del bot. No era un error: era la
# configuración funcionando como estaba escrita.
#
# Y no se arregla quitando el PAT, porque el PAT es justo lo que hace que el
# commit del bot reciba un check —está razonado abajo, en el checkout—. O sea
# que las dos opciones eran empujar con PAT o cancelar en curso, pero no las dos
# a la vez. Se conserva el PAT.
#
# ⚠️ CON `false` LAS EJECUCIONES SE ENCOLAN EN VEZ DE CANCELARSE, que es lo que
# el valor anterior quería evitar. Lo compensa el corte temprano de abajo: en
# cuanto A empuja, se salta todo lo que B va a rehacer igualmente, así que A
# dura lo que dura generar y la cola se vacía sola.
concurrency:
  group: contenido-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar la rama del PR
        uses: actions/checkout@v4
        with:
          # `pull_request` deja el repo en un merge commit desprendido, sin
          # rama. Sin esto no hay adónde empujar.
          ref: ${{ github.head_ref }}
          # ⚠️ AQUÍ IBA `secrets.GITHUB_TOKEN` CON EL ARGUMENTO CONTRARIO: que
          # sus pushes no disparan workflows y así el job no se relanzaba solo.
          # Era cierto y era exactamente el problema.
          #
          # Al empujar lo generado, la CABEZA del PR pasa a ser el commit del
          # bot. Con GITHUB_TOKEN ese commit no dispara nada, así que se queda
          # SIN NINGÚN CHECK — comprobado: 1 check en el commit del autor, 0 en
          # el del bot. Y un check obligatorio que nunca se reporta en la cabeza
          # BLOQUEA el merge para siempre: el cliente vería un PR que no puede
          # publicar y sin explicación.
          #
          # Con un PAT el push sí dispara una segunda ejecución, que vuelve a
          # generar, no encuentra nada que empujar y deja `generar` en verde
          # sobre la cabeza.
          #
          # ⚠️ ESO DEPENDE DE QUE EL GENERADOR SEA IDEMPOTENTE, Y DURANTE UN
          # TIEMPO NO LO FUE: el PDF llevaba dentro la hora del reloj, así que
          # cada ejecución lo reescribía, lo empujaba y arrancaba la siguiente.
          # El PR #4 tiene siete commits del bot seguidos, uno cada ~85 s, y lo
          # cortó el merge —14 segundos después del último—, no el generador.
          # GitHub no aplica aquí su protección anti-bucle porque esa protección
          # solo cubre los pushes con GITHUB_TOKEN, y este va con PAT.
          #
          # Así que el bucle se corta por la idempotencia, pero esa no es una
          # propiedad que se tenga: es una que se comprueba. La comprueba el
          # paso «Comprobar que build y pdf son idempotentes», y por eso ese
          # paso cubre los dos comandos y no solo `build`.
          token: ${{ secrets.PAT_PUBLICAR }}
          # Hace falta historia para comparar con main. Con el fetch-depth 1 de
          # serie no hay base común y el paso siguiente no puede calcularla.
          fetch-depth: 0

      # ⚠️ ESTE PASO EXISTE POR UN FALLO QUE NO DA ERROR Y BORRA CONTENIDO.
      #
      # Las regiones GENERADO: se calculan con los artículos que hay en la rama.
      # Si se abre el PR A, se mergea, y después se mergea un PR B que se generó
      # ANTES —o sea sin ver a A—, las regiones de B no contienen a A: el merge
      # deja la portada, el listado, el sitemap y el feed sin el artículo de A,
      # que sigue existiendo en articulos/ pero ya no lo enlaza nadie.
      #
      # Git no lo ve como conflicto en todos los casos, así que puede colarse en
      # silencio. Se corta aquí: si la rama no está al día con main, el check
      # falla y hay que actualizarla —GitHub tiene un botón «Update branch»—,
      # lo que relanza este workflow y regenera las regiones ya con A dentro.
      #
      # Se comprueba ANTES de generar para no gastar cinco minutos de Chromium
      # en un PR que hay que actualizar igualmente.
      - name: Comprobar que la rama está al día con main
        run: |
          BASE='${{ github.base_ref }}'
          git fetch --quiet origin "$BASE"
          if git merge-base --is-ancestor "origin/$BASE" HEAD; then
            echo "La rama contiene todo lo que hay en $BASE. Al día."
            exit 0
          fi
          DETRAS=$(git rev-list --count "HEAD..origin/$BASE")
          echo "::error title=La rama no está al día::Faltan $DETRAS commit(s) de $BASE. Pulsa «Update branch» en el PR y espera a que este check vuelva a pasar."
          echo ''
          echo "Commits de $BASE que esta rama no tiene:"
          git --no-pager log --oneline "HEAD..origin/$BASE"
          echo ''
          echo 'Por qué importa: las regiones GENERADO: se calculan con los'
          echo 'artículos de esta rama. Sin los de main, al mergear se irían de'
          echo 'la portada, el listado, el sitemap y el feed sin dar ningún error.'
          exit 1

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar dependencias
        working-directory: scripts
        run: npm ci

      - name: Instalar Chromium
        working-directory: scripts
        # `--with-deps` trae además las librerías de sistema que Chromium
        # necesita en el runner. Sin ellas arranca y falla al primer render.
        run: npx playwright install --with-deps chromium

      - name: Generar HTML, imágenes, sitemap y feed
        working-directory: scripts
        run: npm run build

      - name: Generar los PDF
        working-directory: scripts
        run: npm run pdf

      # Si una segunda pasada cambia algo, el generador depende de algo que no
      # debería —el reloj, el orden del sistema de archivos— y a partir de ahí
      # cada PR arrastraría diferencias que nadie ha escrito.
      #
      # ⚠️ ESTE PASO COMPROBABA SOLO `build`, Y EL FALLO QUE HABÍA QUE COGER
      # ESTABA EN `pdf`. Corría `npm run build` dos veces, pero el PDF no lo
      # escribe build: lo escribe pdf. Así que la no-determinación del PDF
      # —Chromium le estampaba la hora del reloj en /CreationDate— pasaba por
      # aquí en verde, PR tras PR, mientras el push con PAT relanzaba el
      # workflow en bucle. Está contado entero en scripts/pdf.mjs.
      #
      # ⚠️ Y SE HACÍA UN `git add -A` ANTES DEL DIFF. Funcionaba para lo que
      # escribe build —el diff comparaba el árbol contra el índice— pero ataba
      # la comprobación al estado del índice de git, que es un sitio raro donde
      # guardar una medición. Ahora se compara con huellas sha256 tomadas antes
      # y después, que no dependen de git y además dicen QUÉ archivo ha
      # cambiado en vez de solo que algo cambió.
      #
      # Son dos pasadas en total, no tres: la primera son los dos pasos de
      # arriba y esta es la segunda.
      - name: Comprobar que build y pdf son idempotentes
        working-directory: scripts
        run: |
          huellas() {
            { [ -d ../articulos ] && find ../articulos -type f -exec sha256sum {} + ; } | sort -k2
            sha256sum ../index.html ../sitemap.xml ../feed.xml
          }

          huellas > /tmp/huellas-antes.txt

          npm run build
          npm run pdf

          huellas > /tmp/huellas-despues.txt

          if ! diff -u /tmp/huellas-antes.txt /tmp/huellas-despues.txt; then
            echo '::error title=El generador no es idempotente::Una segunda pasada de build+pdf cambia archivos. Suele ser algo que depende del reloj o del orden del sistema de archivos. El diff de arriba dice cuáles.'
            exit 1
          fi
          echo 'Idempotente: build y pdf dan el mismo resultado byte a byte.'

      # ⚠️ ESTE PASO PARTE LA EJECUCION EN DOS MITADES, y el output `cambios` es
      # la bisagra. Si aqui se empuja, la cabeza del PR pasa a ser el commit del
      # bot y ESE push dispara una segunda ejecucion que va a rehacer el
      # deployment, la vista previa, las capturas y el comentario sobre el
      # commit bueno. Todo lo que hiciera esta a partir de aqui lo pisaria la
      # otra: la vista previa apuntaria a un commit que ya no es la cabeza y el
      # comentario se reescribiria con el mismo texto dos minutos despues.
      #
      # Asi que cuando `cambios=si` la ejecucion se corta aqui y termina EN
      # VERDE. No es un apaño para que no se vea la X: es que su trabajo esta
      # hecho —generar y empujar— y el resto le toca a la que ella misma acaba
      # de disparar.
      #
      # Antes esto lo «resolvia» cancel-in-progress matando la ejecucion, que
      # llegaba al mismo sitio dejando una X roja y un deployment a medias.
      - name: Añadir lo generado al PR
        id: publicar
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add articulos index.html sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo 'cambios=no' >> "$GITHUB_OUTPUT"
            echo 'Nada que añadir: lo generado ya estaba al día.'
          else
            git commit -m 'Generar artículos, listados y PDF'
            git push origin HEAD:${{ github.head_ref }}
            echo 'cambios=si' >> "$GITHUB_OUTPUT"
            echo '::notice title=Generado y empujado::Lo generado se ha añadido al PR. Esta ejecución termina aquí; la vista previa y el comentario los hace la ejecución que dispara ese push, ya sobre el commit del bot.'
          fi
          # El SHA va al comentario para construir el enlace del PDF. Se lee
          # DESPUES del commit: si se leyera antes, apuntaria a la version sin
          # generar y el PDF no existiria todavia.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------- vista previa ----
      # El artículo se sirve desde GitHub Pages, en un repositorio aparte, bajo
      # una carpeta por PR. Y el enlace NO va en el comentario: se registra un
      # Deployment, que es lo que hace que GitHub pinte el botón nativo
      # «View deployment» en el recuadro del PR.
      #
      # ⚠️ SE COPIA EL SITIO ENTERO, NO SOLO EL ARTÍCULO, y no es por comodidad:
      # todas las rutas del sitio son relativas —`../../css/styles.css`— así que
      # un artículo suelto se vería sin estilos, sin tipografías y sin imágenes.
      # Son ~2,3 MB por PR, que el workflow de limpieza borra al cerrarlo.
      #
      # ⚠️ ESTO SUSTITUYE A raw.githack PARA EL HTML. Githack servía el artículo
      # detrás de una pantalla «One more step» con anuncios y un aviso de no
      # meter contraseñas: para un cliente parece una alerta de seguridad.
      # Comprobado que sale SIEMPRE —no hay cookie y responde con `no-store`— y
      # que `rawcdn.githack.com` tampoco la evita. El PDF sí pasa limpio, por
      # eso ese enlace se queda donde estaba.

      # ⚠️ ESTE PASO ES LA UNICA FUENTE DE «que articulo trae el PR», y antes
      # habia dos. El comentario de abajo lo recalculaba por su cuenta con
      # `pulls.listFiles`, y las dos implementaciones trataban el caso vacio al
      # reves: esta lo tolera —cae a la raiz del sitio— y aquella lo daba por
      # fallo de generacion. De ahi salia el «Vista previa no disponible» en un
      # PR verde con la preview desplegada. Hoy el comentario lee estos outputs.
      #
      # De paso se va el tope de `per_page: 100` de listFiles, que en un PR
      # grande podia dejar el articulo fuera de la lista y disparar el mismo
      # falso aviso.
      #
      # `todos` son TODOS los articulos del sitio, no los del PR. Hace falta
      # para repartir los avisos del build: los que llevan por delante el slug
      # de un articulo que este PR no toca no son de este PR.
      - name: Averiguar qué artículo trae el PR
        id: art
        if: steps.publicar.outputs.cambios != 'si'
        run: |
          SLUGS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- contenido/articulos/ \
                  | cut -d/ -f3 | sort -u | tr '\n' ' ')
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "primero=$(echo $SLUGS | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          TODOS=$({ [ -d contenido/articulos ] && ls -1 contenido/articulos; } | sort -u | tr '\n' ' ')
          echo "todos=$TODOS" >> "$GITHUB_OUTPUT"
          echo "Artículos del PR: ${SLUGS:-ninguno}"
          echo "Artículos del sitio: ${TODOS:-ninguno}"

      # ⚠️ EL `if` DE ESTE PASO ES LO QUE IMPIDE UN DEPLOYMENT COLGADO. Si se ha
      # empujado, aqui no se abre ninguno, asi que `steps.deploy.outputs.id`
      # queda vacio y «Cerrar el deployment» —que exige ese id— se salta solo.
      # No puede quedar un `in_progress` sin su estado final.
      - name: Abrir el deployment
        id: deploy
        if: steps.publicar.outputs.cambios != 'si'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.payload.pull_request.head.ref,
              environment: `vista-previa-pr-${context.payload.pull_request.number}`,
              /* transient: GitHub lo marca inactivo solo cuando se supera o se
                 cierra el PR, así que el botón no sobrevive al artículo. */
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: 'Vista previa del artículo',
            });
            core.setOutput('id', data.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: data.id, state: 'in_progress',
              description: 'Publicando la vista previa…',
            });

      - name: Copiar la vista previa al repositorio de previews
        if: steps.publicar.outputs.cambios != 'si'
        env:
          PAT: ${{ secrets.PAT_PUBLICAR }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          DEST=/tmp/previews
          git clone --quiet --depth 1 \
            "https://x-access-token:$PAT@github.com/${{ github.repository_owner }}/el-derecho-escrito-previews.git" "$DEST"

          rm -rf "$DEST/pr-$PR"
          mkdir -p "$DEST/pr-$PR"

          # ⚠️ ESTO ERA UNA LISTA DE LO QUE SI SE COPIA, Y DEJABA FUERA DOS
          # COSAS SIN QUE NADA AVISARA. Enumeraba index.html, 404.html,
          # robots.txt, sitemap.xml, feed.xml, og.png, los favicons, css, js,
          # img, video, articulos, sobre y contacto — y nada mas.
          #
          # Asi que cualquier pagina nueva nacia invisible en la vista previa.
          # Paso con `privacidad/`, que daba 404 con el enlace del pie ya
          # desplegado y apuntando a ella, y llevaba pasando con `documentos/`,
          # donde vive el CV: el boton «Descargar CV» de `sobre/` daba 404 en
          # TODAS las previews y nadie lo habia notado.
          #
          # El comentario que habia aqui decia «Todo lo que se sirve. Fuera
          # scripts/, contenido/ y .github/»: describia una lista de EXCLUSION
          # mientras el codigo hacia una de INCLUSION. La intencion era la
          # correcta; la implementacion, la contraria.
          #
          # ⚠️ Y EL MODO DE FALLAR ERA EL PEOR POSIBLE: el workflow terminaba en
          # verde, la vista previa se publicaba y el comentario del bot traia su
          # enlace. Solo fallaba la pagina que nadie habia pensado en mirar.
          #
          # Invertido: se copia TODO menos lo que no es el sitio. Una pagina
          # nueva se sirve sola, y esta lista solo hay que tocarla al añadir
          # algo que NO deba publicarse — que es el caso raro y ademas el que se
          # nota, porque aparece donde no toca.
          #
          # ⚠️ PRODUCCION NO NECESITABA ESTE ARREGLO, y conviene saberlo para no
          # buscar el fallo donde no esta: Pages sirve la raiz del repositorio
          # tal cual, asi que alli `privacidad/` y `documentos/` funcionan desde
          # el primer dia. El fallo era SOLO de la vista previa, que es
          # justamente la que se usa para revisar.
          # ⚠️ SIN `dotglob`, A PROPOSITO: `*` no casa con los archivos ocultos,
          # y ninguno de los que hay debe publicarse —`.git`, `.github` y
          # `.gitignore`—. Activarlo arrastraria ademas cualquier basura local
          # que acabe en el runner, y un `.git` copiado dentro de la preview
          # seria un lio de verdad. Si algun dia hace falta un `.nojekyll`,
          # habra que añadirlo a mano: hoy no existe ni se necesita, porque no
          # hay ninguna carpeta del sitio que empiece por guion bajo.
          shopt -s nullglob
          for x in *; do
            case "$x" in
              # No es el sitio: fuentes del generador, contenido sin compilar,
              # configuracion del servidor y documentacion interna.
              contenido|scripts|servidor) continue ;;
              CLAUDE.md|PARA-EL-CLIENTE.md|README.md) continue ;;
              # Fuente de la tarjeta social; lo que se sirve es og.png.
              og.svg) continue ;;
            esac
            cp -R "$x" "$DEST/pr-$PR/"
          done
          shopt -u nullglob

          # Que la vista previa tenga lo que tiene que tener. Si alguien añade
          # una exclusion de mas, esto lo dice aqui en vez de dejar otra pagina
          # dando 404 en silencio durante semanas.
          for x in index.html privacidad sobre contacto articulos documentos css js; do
            if [ ! -e "$DEST/pr-$PR/$x" ]; then
              echo "::error title=Vista previa incompleta::Falta «$x» en el preview. Revisa las exclusiones del paso de copia."
              exit 1
            fi
          done

          # ⚠️ LA VISTA PREVIA VA CON noindex, Y ES LA ÚNICA DIFERENCIA A
          # PROPÓSITO ENTRE EL PREVIEW Y PRODUCCIÓN.
          #
          # El repositorio de previews es público, así que sin esto un borrador
          # que el cliente todavía no ha aprobado sería rastreable. El
          # `canonical` apunta a elderechoescrito.es y Google suele consolidar
          # ahí, pero «suele» no es una garantía para un texto sin publicar.
          #
          # Y `robots.txt` no sirve aquí: solo se lee en la RAÍZ del dominio, y
          # esto vive en un subdirectorio de github.io. Tiene que ir en la
          # etiqueta, página por página.
          #
          # Se SUSTITUYE la etiqueta existente en vez de añadir otra: las seis
          # páginas del sitio llevan ya un `<meta name="robots">`, y dos
          # etiquetas contradictorias en la misma página es un comportamiento
          # que decide el buscador, no nosotros.
          find "$DEST/pr-$PR" -name '*.html' -print0 \
            | xargs -0 sed -i'' -E 's|<meta name="robots"[^>]*>|<meta name="robots" content="noindex, nofollow">|'

          # Que no se cuele ninguna indexable: si el marcado cambiara y el
          # patrón dejara de casar, esto lo dice en vez de publicarlo en
          # silencio.
          QUEDAN=$(grep -rl 'name="robots" content="index' "$DEST/pr-$PR" --include='*.html' | wc -l)
          if [ "$QUEDAN" -ne 0 ]; then
            echo "::error title=Vista previa indexable::$QUEDAN página(s) del preview conservan «index». Revisa el patrón del sed."
            exit 1
          fi
          echo "Vista previa marcada noindex en $(find "$DEST/pr-$PR" -name '*.html' | wc -l) página(s)."

          cd "$DEST"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'La vista previa ya estaba al día.'
          else
            git commit --quiet -m "Vista previa del PR #$PR"
            git push --quiet
          fi

      # ⚠️ PAGES TARDA EN PROPAGAR, Y POR ESO SE ESPERA AQUÍ. Entre el push y
      # que la URL responde pasan de 30 s a un par de minutos. Si el deployment
      # se marcara «success» al empujar, el cliente pulsaría el botón y vería un
      # 404 — que es peor que no tener botón.
      #
      # Sondeando hasta el 200, el botón solo aparece cuando la página existe.
      - name: Esperar a que Pages sirva la vista previa
        id: esperar
        if: steps.publicar.outputs.cambios != 'si'
        env:
          PR: ${{ github.event.pull_request.number }}
          SLUG: ${{ steps.art.outputs.primero }}
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/el-derecho-escrito-previews/pr-$PR"
          URL="$BASE/"
          [ -n "$SLUG" ] && URL="$BASE/articulos/$SLUG/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "lista=si" >> "$GITHUB_OUTPUT"
              echo "Disponible tras ~$((i*10))s: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "lista=no" >> "$GITHUB_OUTPUT"
          echo "::warning title=La vista previa tarda::Pages no ha servido $URL en 5 minutos. El artículo está generado y el PDF disponible; el botón de vista previa aparecerá cuando Pages termine."

      - name: Cerrar el deployment
        if: always() && steps.deploy.outputs.id
        uses: actions/github-script@v7
        with:
          script: |
            const lista = '${{ steps.esperar.outputs.lista }}' === 'si';
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: ${{ steps.deploy.outputs.id }},
              /* Solo `success` pinta el botón. Si Pages no ha llegado a tiempo
                 se queda en `error` a propósito: mejor sin botón que con uno
                 que lleva a un 404. */
              state: lista ? 'success' : 'error',
              environment_url: '${{ steps.esperar.outputs.url }}',
              description: lista ? 'Vista previa lista' : 'Pages aún no ha propagado',
            });

      # ------------------------------------------------------ capturas ----
      # Se hacen DESPUÉS de generar, sobre el HTML ya escrito. Sirven para ver
      # el resultado sin descargar la rama: es lo que convierte el PR en algo
      # revisable por quien no tiene el proyecto montado.

      - name: Capturas a 1440 y 375
        if: steps.publicar.outputs.cambios != 'si'
        working-directory: scripts
        run: node capturas.mjs

      - name: Adjuntar PDF y capturas
        if: steps.publicar.outputs.cambios != 'si'
        uses: actions/upload-artifact@v4
        with:
          name: revision
          path: |
            articulos/**/*.pdf
            scripts/.capturas/**
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------ comentario --
      # El comentario es LO QUE VE EL CLIENTE, que no es técnico. Por eso abre
      # con los enlaces de vista previa y con qué hacer, y deja los avisos del
      # build —erratas del texto, referencias sin citar— al final.
      #
      # La vista previa la sirve raw.githack, que devuelve los archivos del
      # repositorio con su content-type real: el HTML se renderiza y el PDF se
      # abre en el navegador. No hay nada que desplegar ni que limpiar.

      # ⚠️ EL `if` LLEVA ADEMAS EL CORTE: si esta ejecucion ha empujado, el
      # comentario lo escribe la siguiente, ya sobre el commit del bot. Comentar
      # aqui solo serviria para que dos minutos despues lo reescribieran igual.
      #
      # `always()` se queda porque el caso que mas importa comentar es el que
      # FALLA, y ahi los pasos anteriores no han llegado a correr.
      - name: Comentar la vista previa y los avisos
        if: always() && steps.publicar.outputs.cambios != 'si'
        uses: actions/github-script@v7
        env:
          SHA_GENERADO: ${{ steps.publicar.outputs.sha }}
          SLUGS_PR: ${{ steps.art.outputs.slugs }}
          SLUGS_TODOS: ${{ steps.art.outputs.todos }}
          ESTADO_JOB: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const ruta = 'scripts/.avisos.json';
            const avisos = fs.existsSync(ruta) ? JSON.parse(fs.readFileSync(ruta, 'utf8')) : [];

            /* ⚠️ EL ENLACE VA POR SHA Y NO POR NOMBRE DE RAMA, y no es un
               detalle: las ramas que abre n8n llevan BARRA
               —`articulo/falta-de-masc-…`— y en la URL de githack, que es
               `/owner/repo/REF/ruta`, una barra en la ref hace que el servicio
               parta por donde no es. El enlace daría 404 y parecería que la
               vista previa no funciona.

               Por SHA es además más fiel: apunta al commit exacto que se está
               revisando, no a «lo último que haya en la rama». */
            const sha = process.env.SHA_GENERADO;

            /* ⚠️ LOS SLUGS LLEGAN DEL PASO `art`, NO SE RECALCULAN AQUI. Este
               bloque hacia su propio `pulls.listFiles` y la lista salia a veces
               distinta de la que usaba el resto del job; esta contado entero
               sobre aquel paso. Una sola fuente. */
            const lista = (s) => (s || '').trim().split(/\s+/).filter(Boolean);
            const slugs = lista(process.env.SLUGS_PR);
            const todos = lista(process.env.SLUGS_TODOS);

            /* ⚠️ TRES ESTADOS, NO DOS, Y EL DEL ERROR SE DETECTA POR EL ESTADO
               REAL DEL JOB. La condicion era `sha && slugs.length`, asi que un
               PR que no trae ningun articulo —uno de diseño, de codigo o de
               documentacion— caia en la rama del error y anunciaba «El articulo
               no se ha podido generar» con el check en verde y la vista previa
               desplegada. Decia algo falso y ademas dejaba el mensaje de error
               de verdad sin poder distinguirse. */
            const fallo = process.env.ESTADO_JOB !== 'success';

            const base = `https://raw.githack.com/${context.repo.owner}/${context.repo.repo}/${sha}`;

            /* ⚠️ EL ENLACE DEL ARTÍCULO YA NO VA AQUÍ. Lo pinta GitHub en el
               recuadro de arriba, como botón «View deployment», porque es donde
               el cliente lo espera y porque así solo aparece cuando la página
               existe de verdad —el deployment se marca `success` después de
               comprobar que Pages responde—.
               El del PDF sí se queda: lo sirve githack, que para PDF funciona
               limpio, y así hay algo que mirar aunque Pages tarde. */
            const conArticulo = ['## Vista previa del artículo', '',
                 'El artículo se abre con el botón **«View deployment»** del recuadro',
                 'de arriba. Aparece en cuanto la vista previa está lista.',
                 '',
                 ...slugs.map(s => `[Ver el PDF descargable](${base}/articulos/${s}/${s}.pdf)`),
                 '',
                 '### Qué conviene mirar', '',
                 '- Que el **titular** y la **entradilla** sean los correctos.',
                 '- Que la **imagen de portada** sea la que toca.',
                 '- Que estén **todos los apartados**, en orden y con sus números.',
                 '- Que las **citas y referencias** del final estén completas.',
                 '',
                 '### Si está bien', '',
                 'Pulsa el botón verde **«Merge pull request»** al final de esta página.',
                 'Con eso el artículo queda publicado en la web.',
                 '',
                 '### Si algo no está bien', '',
                 '**No pulses el botón.** Escribe aquí abajo qué hay que cambiar y se',
                 'corrige antes de publicar.',
                 '',
                 '---', '',
                ].join('\n');

            /* Sin alarma a proposito: no pasa nada malo, simplemente este PR no
               trae texto nuevo. Se enseña el sitio entero porque es lo que un
               cambio de diseño o de plantilla necesita revisar. */
            const sinArticulo = ['## Este PR no trae ningún artículo', '',
                 'No hay texto nuevo que revisar: son cambios de diseño, de código o de',
                 'documentación.',
                 '',
                 'Las páginas del sitio **se han regenerado** con esos cambios, así que lo',
                 'que hay que mirar es que nada se haya descolocado. El sitio completo se',
                 'abre con el botón **«View deployment»** del recuadro de arriba: la',
                 'portada, el listado y los artículos que ya estaban publicados.',
                 '',
                 '---', '',
                ].join('\n');

            const conFallo = ['## No se ha podido generar', '',
                 'El build ha fallado, así que no hay vista previa y **no se puede mergear**',
                 'todavía. En la pestaña **«Checks»**, arriba, está el paso que ha fallado y',
                 'el motivo.',
                 '',
                 '---', '',
                ].join('\n');

            const previa = fallo ? conFallo : (slugs.length ? conArticulo : sinArticulo);

            /* ⚠️ LOS AVISOS SE REPARTEN, PORQUE `.avisos.json` ES DE TODO EL
               SITIO Y NO DE ESTE PR. El build recorre todos los articulos, asi
               que en un PR de un articulo se colaban en la misma lista los
               avisos de los demas, presentados como si fueran del texto que el
               cliente esta revisando.

               El reparto es por el prefijo «<slug>: » que el build pone delante
               de muchos avisos:

                 prefijo de un articulo QUE ESTE PR NO TOCA  -> apartado aparte
                 todo lo demas                               -> lista principal

               ⚠️ «todo lo demas» incluye A PROPOSITO los avisos SIN prefijo, y
               no es pereza: hoy varios se escriben como «La imagen de portada de
               ESTE articulo no la has aportado tu…», sin decir de cual. Ese es
               justo el aviso que el cliente tiene que leer, asi que ante la duda
               se queda arriba. Degradarlo a un desplegable por no saber de quien
               es seria esconder lo importante.

               La solucion completa es que `build.mjs` prefije SIEMPRE con el
               slug; mientras no lo haga, este reparto es lo que se puede hacer
               sin mentir. */
            const ajeno = (a) => {
              const m = a.match(/^([^:\s]+):\s/);
              return !!(m && todos.includes(m[1]) && !slugs.includes(m[1]));
            };
            const mios  = avisos.filter(a => !ajeno(a));
            const otros = avisos.filter(ajeno);

            /* ⚠️ LAS DOS FRASES TRANQUILIZADORAS VAN CONDICIONADAS A QUE EL JOB
               HAYA IDO BIEN, y sin eso se contradicen solas. Un build que falla
               DESPUES de escribir `.avisos.json` —por ejemplo en el paso de
               idempotencia— llegaba aqui con avisos y con el job en rojo, y
               remataba la lista con «si hubiera un error, el job habria
               fallado». Y sin avisos decia «Build sin avisos», que se lee como
               que todo fue limpio justo cuando no termino. */
            const rotulo = slugs.length ? 'Avisos del build' : 'Avisos del build (de todo el sitio)';
            const cola = [];
            if (mios.length) {
              cola.push('### ' + rotulo, '', ...mios.map(a => `- ${a}`));
              if (!fallo) {
                cola.push('', 'Ninguno impide publicar: si hubiera un error, el job habría fallado.');
              }
            } else if (!fallo) {
              cola.push('### Build sin avisos', '');
            }
            if (otros.length) {
              cola.push('', '<details><summary>Avisos de otros artículos del sitio (' +
                        otros.length + ') — no son de este PR</summary>', '',
                        ...otros.map(a => `- ${a}`), '', '</details>');
            }
            if (!fallo && slugs.length) {
              cola.push('', 'El PDF y las capturas a 1440 y 375 van también en el artefacto **revision**.');
            }

            const cuerpo = previa + cola.join('\n');

            // Se reutiliza el comentario anterior en vez de apilar uno por
            // push: si no, un PR con tres correcciones acaba con tres listas de
            // avisos y hay que mirar la fecha para saber cuál vale.
            const marca = '<!-- avisos-del-build -->';
            const { data: previos } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.payload.pull_request.number,
            });
            const mio = previos.find(c => c.body.includes(marca));

            if (mio) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: mio.id, body: marca + '\n' + cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.payload.pull_request.number,
                body: marca + '\n' + cuerpo,
              });
            }
